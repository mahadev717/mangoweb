                        <label className="form-label" style={{ fontFamily: 'Cinzel, serif', fontSize: '0.75rem', color: 'var(--gold-primary)' }}>WhatsApp / Mobile *</label>
                        <input type="tel" name="custPhone" className="form-input" placeholder="+91 98765 43210" required />
                      </div>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1rem' }}>
                      <div className="form-group">
                        <label className="form-label" style={{ fontFamily: 'Cinzel, serif', fontSize: '0.75rem', color: 'var(--gold-primary)' }}>Destination City & Country *</label>
                        <input type="text" name="custCity" className="form-input" placeholder="e.g. Mumbai / London / Dubai / New York" required />
                      </div>
                    </div>
                    <button type="submit" className="btn-vintage btn-vintage-primary" style={{ width: '100%', padding: '0.9rem', marginTop: '0.8rem' }}>
                      ✦ Submit Inquiry & Connect Trade Desk
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* Modal 4: Interactive Cart Drawer */}
          <div className={`cart-drawer-overlay ${isCartOpen ? 'active' : ''}`} onClick={() => setIsCartOpen(false)}>
            <div className="cart-drawer" onClick={e => e.stopPropagation()}>
              <div className="cart-drawer-header">
                <h3 className="font-serif" style={{ color: 'var(--gold-bright)' }}>🛒 Trade Order Cart ({totalItems})</h3>
                <button className="modal-close" onClick={() => setIsCartOpen(false)}>✕</button>
              </div>
              <div className="cart-drawer-body">
                {cart.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '3rem 0', color: 'var(--ink-chestnut)' }}>
                    <span style={{ fontSize: '2.5rem', display: 'block', marginBottom: '0.8rem' }}>🧺</span>
                    <p style={{ fontWeight: '600' }}>Your trade order cart is currently empty.</p>
                    <p style={{ fontSize: '0.85rem', color: '#888', marginTop: '0.4rem' }}>Select your favorite Alphonso boxes, Basmati, or Spices to get started!</p>
                  </div>
                ) : (
                  <div>
                    {cart.map(item => (
                      <div key={item.id} className="cart-item">
                        <img src={item.image} alt={item.name} className="cart-item-img" />
                        <div style={{ flex: 1 }}>
                          <strong style={{ fontSize: '0.92rem', color: 'var(--ink-primary)', display: 'block' }}>{item.name}</strong>
                          <span style={{ fontSize: '0.8rem', color: 'var(--gold-primary)', fontWeight: '700' }}>{item.priceDozen}</span> x {item.qty}
                        </div>
                        <button className="btn-vintage btn-vintage-outline" style={{ padding: '0.2rem 0.6rem', fontSize: '0.75rem' }} onClick={() => removeFromCart(item.id)}>
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              {cart.length > 0 && (
                <div className="cart-drawer-footer">
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', fontFamily: 'Playfair Display, serif', fontSize: '1.2rem', fontWeight: '800' }}>
                    <span>Estimated Total:</span>
                    <span style={{ color: 'var(--gold-dark)' }}>₹ {cartTotal.toLocaleString()}</span>
                  </div>
                  <a href={`https://wa.me/919876543210?text=Greetings%20CG%20Brothers!%20I%20would%20like%20to%20place%20an%20import-export%20order%20for:%20${encodeURIComponent(cart.map(i=>`${i.name} (x${i.qty})`).join(', '))}`} target="_blank" className="btn-vintage btn-vintage-primary" style={{ width: '100%', textAlign: 'center' }}>
                    ✦ Checkout via WhatsApp Concierge
                  </a>
                </div>
              )}
            </div>
          </div>

          {/* Social Notification Toast */}
          {currentToast && (
            <div className="vintage-toast">
              <span style={{ fontSize: '1.2rem' }}>📦</span>
              <div style={{ fontSize: '0.85rem' }}>
                <div>{currentToast.text}</div>
                <div style={{ fontSize: '0.75rem', color: 'var(--gold-bright)', marginTop: '2px' }}>{currentToast.time}</div>
              </div>
              <button className="toast-close" onClick={() => setCurrentToast(null)}>✕</button>
            </div>
          )}

          {/* WhatsApp Floating CTA */}
          <a href="https://wa.me/919876543210" target="_blank" className="whatsapp-float" title="Direct Concierge Chat">
            💬
          </a>

          {/* Footer */}
          <footer className="footer" id="contact">
            <div className="container">
              <div className="footer-grid">
                <div>
                  <div className="brand-logo" style={{ marginBottom: '1rem' }}>
                    <div className="logo-crest">CG</div>
                    <div className="logo-text-group">
                      <span className="logo-main-title" style={{ color: '#faf6ef' }}>CG BROTHERS</span>
                      <span className="logo-subtitle" style={{ color: 'var(--gold-bright)' }}>IMPORT & EXPORT HOUSE</span>
                    </div>
                  </div>
                  <p style={{ fontSize: '0.9rem', color: '#d1c5b4' }}>
                    Official APEDA & FSSAI certified importers and exporters of GI Alphonso, Gir Kesar, Spices, 1121 Basmati & Cold-Chain Logistics.
                  </p>
                </div>
                <div>
                  <h4 className="footer-title">Commodities</h4>
                  <ul className="footer-links">
                    <li><a href="#catalog">Ratnagiri Alphonso Hapus</a></li>
                    <li><a href="#catalog">Salem High-Curcumin Turmeric</a></li>
                    <li><a href="#catalog">1121 XXL Basmati Rice</a></li>
                    <li><a href="#catalog">Global Air & Ocean Freight</a></li>
                  </ul>
                </div>
                <div>
                  <h4 className="footer-title">Global Trade Desk</h4>
                  <p style={{ fontSize: '0.9rem', color: '#faf6ef' }}>📞 +91 98765 43210</p>
                  <p style={{ fontSize: '0.9rem', color: '#faf6ef' }}>✉️ trade@cgbrothersmangoes.com</p>
                </div>
              </div>
              <div style={{ paddingTop: '1.8rem', borderTop: '2px solid var(--gold-primary)', fontSize: '0.85rem' }}>
                © ANNO 1988 - 2026 CG Brothers Agricultural Import & Export House. All Rights Reserved. Powered by React 18.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
